<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VocabFlow Debug</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #1a1a26; color: #e0e0e0;
    font-size: 14px; line-height: 1.5;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: #88c; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .meta { background: #22222e; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
  .meta div { margin: 2px 0; }
  .meta b { color: #fc8; }
  .btn {
    display: inline-block; padding: 10px 14px; margin: 4px 4px 4px 0;
    background: #4a5; color: #fff; border: none; border-radius: 4px;
    font-size: 14px; cursor: pointer; touch-action: manipulation;
  }
  .btn-sec { background: #557; }
  .btn:active { opacity: 0.7; }
  select { padding: 8px; background: #2a2a36; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { padding: 6px 4px; border-bottom: 1px solid #333; text-align: left; }
  th { background: #2a2a36; color: #aab; position: sticky; top: 0; cursor: pointer; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.complete { background: #1a2a1a; }
  .stage-new { color: #666; }
  .stage-intro { color: #f80; }
  .stage-recognition { color: #fc4; }
  .stage-recall { color: #cf4; }
  .stage-dictation { color: #4cf; }
  .stage-mastered { color: #4f8; font-weight: bold; }
  .stage-handwrite { color: #c4f; }
  .excluded { opacity: 0.5; text-decoration: line-through; }
  .copy-area { margin-top: 8px; }
  textarea {
    width: 100%; min-height: 100px; background: #0e0e16; color: #cde;
    border: 1px solid #333; border-radius: 4px; padding: 8px;
    font-family: monospace; font-size: 11px;
  }
  .notice { color: #fa6; font-size: 12px; margin-top: 4px; }
  .err { color: #f55; }
  .devtools { background: #22222e; padding: 10px; border-radius: 6px; }
  .devnote { font-size: 12px; color: #aab; margin: 0 0 8px; }
  .devnote a { color: #8cf; }
</style>
</head>
<body>
<h1>VocabFlow Debug</h1>

<div id="status"></div>

<div>
  <label>表示中のキー: </label>
  <select id="key-select">
    <option value="vocabflow_state_v1">本番（vocabflow_state_v1）</option>
    <option value="vocabflow_state_dev_v1">dev（vocabflow_state_dev_v1）</option>
  </select>
</div>

<div class="meta" id="meta"></div>

<div>
  <button class="btn" id="btn-refresh">再読込</button>
  <button class="btn btn-sec" id="btn-copy-full">全 state をコピー</button>
  <button class="btn btn-sec" id="btn-show-full">全 state を表示</button>
  <button class="btn btn-sec" id="btn-download-gz">📦 gzip でダウンロード</button>
  <button class="btn btn-sec" id="btn-download-json">📄 JSON でダウンロード</button>
</div>

<h2>Wave サマリ</h2>
<div id="wave-summary"></div>

<h2>Wave 詳細</h2>
<div>
  <label>表示する Wave: </label>
  <select id="wave-select"></select>
  <button class="btn btn-sec" id="btn-copy-wave">この Wave をコピー</button>
</div>
<div id="wave-detail"></div>

<div class="copy-area">
  <textarea id="copy-textarea" placeholder="コピー結果がここに表示されます（iOS Chrome でクリップボード書込が失敗した場合は長押しでコピー）" readonly></textarea>
</div>

<h2>dev 実機再現ツール</h2>
<div class="devtools">
  <p class="devnote">
    書き込み先は <b>dev キー（vocabflow_state_dev_v1）のみ</b>。本番キーには一切触れません。
    仕込んだあと <a href="app.html?dev">app.html?dev</a> を開いて実機で踏みます。
  </p>
  <button class="btn" id="btn-seed-arrival">到達の再現（次の1枚目で到達）</button>
  <button class="btn" id="btn-seed-wall">到達の再現（復習の壁 → 次セッションで到達）</button>
  <button class="btn btn-sec" id="btn-clear-dev">dev state を削除</button>
  <div style="margin-top:8px">
    <label>state ファイルを dev キーに読み込む（.json / .json.gz）: </label><br>
    <input type="file" id="file-import" accept=".json,.gz,application/json,application/gzip">
  </div>
</div>

<script type="module">
import { WORD_DATA } from '../core/word-data.js';

const PROD_KEY = 'vocabflow_state_v1';
const DEV_KEY  = 'vocabflow_state_dev_v1'; // 実機再現の書き込み先はここだけ
const STAGES = ['new', 'intro', 'recognition', 'recall', 'dictation', 'handwrite', 'mastered'];

const viewKey = () => document.getElementById('key-select').value;

const wordIdToString = new Map();
for (const w of WORD_DATA) wordIdToString.set(w.id, w.word);

let state = null;
let sortKey = 'wordId';
let sortAsc = true;

function load() {
  const key = viewKey();
  const raw = localStorage.getItem(key);
  if (!raw) {
    document.getElementById('status').innerHTML = `<div class="err">localStorage["${key}"] が見つかりません。アプリを起動してからこのページを開いてください。</div>`;
    return null;
  }
  try {
    return JSON.parse(raw);
  } catch (e) {
    document.getElementById('status').innerHTML = `<div class="err">JSON パース失敗: ${e.message}</div>`;
    return null;
  }
}

function fmtTime(unixMs) {
  if (!unixMs) return '—';
  const d = new Date(unixMs);
  return d.toLocaleString('ja-JP');
}

function fmtH(h) {
  if (!h || h <= 0) return '—';
  if (h >= 365) return (h / 365).toFixed(1) + '年';
  if (h >= 30)  return (h / 30).toFixed(1) + 'ヶ月';
  if (h >= 1)   return h.toFixed(1) + '日';
  return (h * 24).toFixed(1) + '時間';
}

function fmtDay(daysFloat) {
  if (daysFloat === undefined || daysFloat === null) return '—';
  return daysFloat.toFixed(2);
}

function renderMeta() {
  const m = document.getElementById('meta');
  m.innerHTML = `
    <div><b>currentTime</b>: ${fmtDay(state.currentTime)} 日</div>
    <div><b>sessionsCompleted</b>: ${state.sessionsCompleted ?? '—'}</div>
    <div><b>totalCardsConsumed</b>: ${state.totalCardsConsumed ?? '—'}</div>
    <div><b>activeWaves</b>: [${(state.activeWaves ?? []).join(', ')}]</div>
    <div><b>savedAt</b>: ${fmtTime(state.savedAt)}</div>
    <div><b>words 件数</b>: ${state.words?.length ?? 0}</div>
    <div><b>waveUnlockEvents</b>（供給ゲートが開いた日）: ${fmtWaveEvents(state.waveUnlockEvents)}</div>
    <div><b>waveArrivedEvents</b>（最初の語が画面に出た日）: ${fmtWaveEvents(state.waveArrivedEvents)}</div>
    <div><b>everArrivedWaves</b>: [${(state.everArrivedWaves ?? []).join(', ')}]</div>
  `;
}

// 解放と到達は別イベントで、復習の壁の下では数セッションずれる。両方を並べて
// 「ゲートは開いたが語が流れていない wave」が一目で分かるようにする。
function fmtWaveEvents(events) {
  if (!events) return '—（この state には記録なし）';
  if (events.length === 0) return '0 件';
  return events.map(e => `W${e.waveNumber}@Day${fmtDay(e.day)}`).join(' / ');
}

function renderWaveSummary() {
  const byWave = new Map();
  for (const w of state.words) {
    if (!byWave.has(w.waveNumber)) {
      byWave.set(w.waveNumber, { total: 0, excluded: 0, byStage: {}, allMastered: true });
    }
    const e = byWave.get(w.waveNumber);
    e.total++;
    if (w.excluded) e.excluded++;
    e.byStage[w.stage] = (e.byStage[w.stage] ?? 0) + 1;
    if (!w.excluded && w.stage !== 'mastered') e.allMastered = false;
  }

  const waves = [...byWave.keys()].sort((a, b) => a - b);
  let html = '<table><thead><tr><th>Wave</th><th class="num">総数</th><th class="num">除外</th>';
  for (const s of STAGES) html += `<th class="num stage-${s}">${s}</th>`;
  html += '<th>全mastered?</th></tr></thead><tbody>';
  for (const wn of waves) {
    const e = byWave.get(wn);
    const cls = e.allMastered ? 'complete' : '';
    html += `<tr class="${cls}"><td><b>${wn}</b></td><td class="num">${e.total}</td><td class="num">${e.excluded}</td>`;
    for (const s of STAGES) html += `<td class="num stage-${s}">${e.byStage[s] ?? ''}</td>`;
    html += `<td>${e.allMastered ? '✅' : ''}</td></tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('wave-summary').innerHTML = html;

  // populate selector
  const sel = document.getElementById('wave-select');
  const prev = sel.value;
  sel.innerHTML = waves.map(wn => `<option value="${wn}">Wave ${wn}</option>`).join('');
  if (prev && waves.includes(parseInt(prev))) sel.value = prev;
  else sel.value = waves.find(wn => !byWave.get(wn).allMastered) ?? waves[0];
}

function renderWaveDetail() {
  const wn = parseInt(document.getElementById('wave-select').value);
  if (!wn) { document.getElementById('wave-detail').innerHTML = ''; return; }

  const words = state.words.filter(w => w.waveNumber === wn);
  words.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'word') { va = wordIdToString.get(a.wordId) ?? ''; vb = wordIdToString.get(b.wordId) ?? ''; }
    if (va === undefined) va = -1;
    if (vb === undefined) vb = -1;
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  const cols = [
    ['wordId', 'ID'],
    ['word', '単語'],
    ['stage', 'stage'],
    ['h', 'h'],
    ['peakH', 'peakH'],
    ['reviewCount', '復習'],
    ['correctCount', '正解'],
    ['incorrectCount', '不正解'],
    ['stuckCount', 'stuck'],
    ['lastReviewed', 'lastRev(日)'],
    ['skipped', 'skip'],
    ['excluded', 'excl'],
  ];

  let html = '<table><thead><tr>';
  for (const [k, label] of cols) {
    const arrow = sortKey === k ? (sortAsc ? ' ▲' : ' ▼') : '';
    html += `<th data-sort="${k}">${label}${arrow}</th>`;
  }
  html += '</tr></thead><tbody>';
  for (const w of words) {
    const wordStr = wordIdToString.get(w.wordId) ?? `?${w.wordId}`;
    const cls = w.excluded ? 'excluded' : '';
    html += `<tr class="${cls}">`;
    html += `<td class="num">${w.wordId}</td>`;
    html += `<td><b>${wordStr}</b></td>`;
    html += `<td class="stage-${w.stage}">${w.stage}</td>`;
    html += `<td class="num">${fmtH(w.h)}</td>`;
    html += `<td class="num">${fmtH(w.peakH)}</td>`;
    html += `<td class="num">${w.reviewCount ?? 0}</td>`;
    html += `<td class="num">${w.correctCount ?? 0}</td>`;
    html += `<td class="num">${w.incorrectCount ?? 0}</td>`;
    html += `<td class="num">${w.stuckCount ?? 0}</td>`;
    html += `<td class="num">${fmtDay(w.lastReviewed)}</td>`;
    html += `<td>${w.skipped ? '⚑' : ''}</td>`;
    html += `<td>${w.excluded ? '✕' : ''}</td>`;
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('wave-detail').innerHTML = html;

  // bind sort handlers
  document.querySelectorAll('#wave-detail th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (sortKey === k) sortAsc = !sortAsc;
      else { sortKey = k; sortAsc = true; }
      renderWaveDetail();
    });
  });
}

async function copyToClipboard(text) {
  document.getElementById('copy-textarea').value = text;
  try {
    await navigator.clipboard.writeText(text);
    flashNotice('クリップボードにコピーしました');
  } catch (e) {
    flashNotice('クリップボード書込が失敗（下のテキストエリアから手動でコピーしてください）');
  }
}

let noticeTimer = null;
function flashNotice(msg) {
  const s = document.getElementById('status');
  s.innerHTML = `<div class="notice">${msg}</div>`;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { s.innerHTML = ''; }, 3000);
}

function refresh() {
  state = load();
  if (!state) {
    document.getElementById('meta').innerHTML = '';
    document.getElementById('wave-summary').innerHTML = '';
    document.getElementById('wave-detail').innerHTML = '';
    document.getElementById('wave-select').innerHTML = '';
    return;
  }
  document.getElementById('status').innerHTML = '';
  renderMeta();
  renderWaveSummary();
  renderWaveDetail();
}

// localStorage の state をファイルとしてダウンロード（メール本文貼り付けの限界回避）。
// gzip 圧縮でメール添付・Drive アップロードしやすいサイズに縮める（JSON は 80〜90% 縮む）。
async function downloadState(compress) {
  if (!state) { flashNotice('state がありません'); return; }
  const json  = JSON.stringify(state);            // compact（インデントなし＝最小）
  const day   = Math.floor(state.currentTime ?? 0);
  const stamp = new Date().toISOString().slice(0, 10);
  let blob, name;
  if (compress && typeof CompressionStream !== 'undefined') {
    const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    blob = await new Response(stream).blob();
    name = `vocabflow-state-day${day}-${stamp}.json.gz`;
  } else {
    if (compress) flashNotice('この環境は gzip 非対応 → 素の JSON で保存します');
    // application/octet-stream で iOS でもインライン表示でなく確実にダウンロード
    blob = new Blob([json], { type: 'application/octet-stream' });
    name = `vocabflow-state-day${day}-${stamp}.json`;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flashNotice(`${name}（${(blob.size / 1024).toFixed(1)} KB）を保存しました`);
}

// -------------------------------------------------------
// dev 実機再現ツール（書き込み先は DEV_KEY のみ）
// -------------------------------------------------------

// 本番と同じ形＝「Wave が過去のセッションで解放済み・まだ1語も到達していない」state を
// dev 用（9語・waveSize 3）で組み立てる。本番の次の機会（Wave 10）は約100語先で待てないため、
// 到達 overlay の発火を実機で踏むための最短経路。
// wall=true: Wave 1・2 の6語すべてを due にして復習が sessionSize(5) を食い尽くす形にする。
//   本番 Wave 9 と同じ「ゲートは過去のセッションで開いたが、その回は新語枠 0」の再現で、
//   1セッション消化した後の「続ける」で初めて Wave 3 が到達する。
function buildArrivalReproState(wall = false) {
  const devWords = WORD_DATA.slice(0, 9); // app.js の DEV_WORD_COUNT と同じ
  const currentTime = 3.0;
  const words = devWords.map((wd, i) => {
    const waveNumber = Math.ceil((i + 1) / 3); // DEV_CONFIG.waveSize = 3
    const base = {
      wordId: wd.id, waveNumber,
      h: 0, peakH: 0, lastReviewed: 0, stage: 'new',
      reviewCount: 0, correctCount: 0, incorrectCount: 0, stuckCount: 0,
      needsHandwrite: false, skipped: false, excluded: false, passiveCursor: 0,
    };
    if (waveNumber === 3) return base; // 到達前の wave（まだ1語も出ていない）
    // Wave 1・2 は学習済み。半分を due にして「復習 + 新語」の混ざったセッションにする
    const due = wall || i % 2 === 0;
    return {
      ...base,
      h: 2.5, peakH: 2.5,
      lastReviewed: currentTime - (due ? 0.8 : 0.1),
      stage: 'mastered',
      reviewCount: 4, correctCount: 4,
    };
  });

  return {
    words,
    config: { waveSize: 3, sessionsPerDay: 3, handwriteStuckThreshold: 3 },
    currentTime,
    totalCardsConsumed: 30,
    sessionsCompleted: 6,
    // ゲートは過去のセッションで開いている（本番 Wave 9 と同じ形）
    waveUnlockEvents: [{ waveNumber: 2, day: 1.2 }, { waveNumber: 3, day: 2.1 }],
    activeWaves: [1, 2, 3],
    everClearedWaves: [],
    // Wave 3 は未到達（記録なし）→ 最初の語が画面に出た瞬間に overlay が出るはず
    waveArrivedEvents: [
      { waveNumber: 1, day: 0.0, session: 1 },
      { waveNumber: 2, day: 1.4, session: 4 },
    ],
    everArrivedWaves: [1, 2],
    savedAt: Date.now(),
  };
}

function writeDevState(obj, label) {
  obj.savedAt = Date.now(); // 起動時の時間ジャンプを防ぐ
  localStorage.setItem(DEV_KEY, JSON.stringify(obj));
  document.getElementById('key-select').value = DEV_KEY;
  refresh();
  flashNotice(`${label} を ${DEV_KEY} に書き込みました（本番キーは未変更）`);
}

document.getElementById('btn-seed-arrival').addEventListener('click', () => {
  writeDevState(buildArrivalReproState(false), '到達の再現 state（次の1枚目で到達）');
});

document.getElementById('btn-seed-wall').addEventListener('click', () => {
  writeDevState(buildArrivalReproState(true), '到達の再現 state（復習の壁 → 次セッションで到達）');
});

document.getElementById('btn-clear-dev').addEventListener('click', () => {
  localStorage.removeItem(DEV_KEY);
  refresh();
  flashNotice(`${DEV_KEY} を削除しました`);
});

document.getElementById('file-import').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const isGz = buf[0] === 0x1f && buf[1] === 0x8b;
    let text;
    if (isGz) {
      if (typeof DecompressionStream === 'undefined') throw new Error('この環境は gzip 展開に非対応です');
      const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
      text = await new Response(stream).text();
    } else {
      text = new TextDecoder().decode(buf);
    }
    const obj = JSON.parse(text);
    if (!Array.isArray(obj.words)) throw new Error('words 配列がありません（VocabFlow の state ではない？）');
    if (obj.words.length !== 9) {
      flashNotice(`注意: ${obj.words.length} 語の state です。dev モード（9語・waveSize 3）とは形が違うため waveSize 移行が走ります`);
    }
    writeDevState(obj, file.name);
  } catch (err) {
    document.getElementById('status').innerHTML = `<div class="err">import 失敗: ${err.message}</div>`;
  } finally {
    e.target.value = '';
  }
});

document.getElementById('key-select').addEventListener('change', refresh);
document.getElementById('btn-refresh').addEventListener('click', refresh);
document.getElementById('btn-download-gz').addEventListener('click', () => downloadState(true));
document.getElementById('btn-download-json').addEventListener('click', () => downloadState(false));
document.getElementById('btn-copy-full').addEventListener('click', () => {
  copyToClipboard(JSON.stringify(state, null, 2));
});
document.getElementById('btn-show-full').addEventListener('click', () => {
  document.getElementById('copy-textarea').value = JSON.stringify(state, null, 2);
});
document.getElementById('btn-copy-wave').addEventListener('click', () => {
  const wn = parseInt(document.getElementById('wave-select').value);
  const words = state.words.filter(w => w.waveNumber === wn).map(w => ({
    ...w,
    _wordStr: wordIdToString.get(w.wordId) ?? null,
  }));
  copyToClipboard(JSON.stringify({ wave: wn, words }, null, 2));
});
document.getElementById('wave-select').addEventListener('change', renderWaveDetail);

refresh();
</script>
</body>
</html>
